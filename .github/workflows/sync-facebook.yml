name: Sync Facebook feed

# Pulls the latest posts + photos from the Facebook Page into the repo.
# The access token lives in GitHub Secrets and never reaches the browser.

on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours (UTC)
  workflow_dispatch:            # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-facebook
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull posts from Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/sync-facebook.mjs

      - name: Commit any changes
        run: |
          git config user.name  "facebook-sync"
          git config user.email "actions@github.com"
          git add data/feed.json assets/feed
          if git diff --staged --quiet; then
            echo "No new posts — nothing to commit."
          else
            git commit -m "Sync Facebook feed ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
